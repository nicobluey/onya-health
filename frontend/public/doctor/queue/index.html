<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Queue - Onya Health</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; margin: 0; background: #f6fafd; color: #0a1931; }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid #b3cfe5;
        background: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      h1 { margin: 0; font-size: 24px; font-family: "Inter", Arial, sans-serif; }
      .header-actions { display: flex; align-items: center; gap: 8px; }
      button, .action-link {
        border: 1px solid #b3cfe5;
        background: #fff;
        color: #1a3d63;
        border-radius: 10px;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        font-size: 13px;
      }
      .wrap { max-width: 980px; margin: 24px auto; padding: 0 16px; }
      .meta { color: #4a7fa7; margin-bottom: 14px; }
      .list { display: grid; gap: 12px; }
      .card { background: #fff; border: 1px solid #b3cfe5; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
      .card.needs-reply { border-color: #4a7fa7; box-shadow: inset 3px 0 0 #1a3d63; }
      .id { font-size: 12px; color: #4a7fa7; margin-top: 4px; }
      .card-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
      .risk { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-block; }
      .risk-low { background: #dcfce7; color: #1a3d63; }
      .risk-medium { background: #fef3c7; color: #92400e; }
      .risk-high { background: #fee2e2; color: #991b1b; }
      .message-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: #eaf4ff; color: #1a3d63; font-size: 12px; font-weight: 700; }
      .message-icon { width: 14px; height: 14px; flex: none; }
      a.review-link { background: #1a3d63; color: white; text-decoration: none; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 700; }
      .empty { text-align: center; padding: 32px; border: 1px dashed #b3cfe5; border-radius: 12px; color: #4a7fa7; background: #fff; }
      .profile-card { background: #fff; border: 1px solid #b3cfe5; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
      .profile-card.hidden, .accounts-card.hidden { display: none; }
      .profile-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      label { display: block; font-size: 12px; font-weight: 700; color: #4a7fa7; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #b3cfe5;
        border-radius: 10px;
        padding: 10px;
        font: inherit;
      }
      .profile-actions { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
      .primary-btn { border-color: #1a3d63; background: #1a3d63; color: #fff; }
      .status { min-height: 18px; font-size: 13px; }
      .status.error { color: #a93736; }
      .status.success { color: #1a3d63; }
      .accounts-card { background: #fff; border: 1px solid #b3cfe5; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
      .accounts-list { display: grid; gap: 10px; margin-top: 12px; }
      .account-row { border-top: 1px solid #dce8f2; padding-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
      .account-row:first-child { border-top: 0; padding-top: 0; }
      .account-details { min-width: 0; }
      .account-email { color: #4a7fa7; font-size: 13px; overflow-wrap: anywhere; }
      .account-actions { display: flex; gap: 8px; }
      .reject-btn { color: #a93736; border-color: #e4b8b8; }
      @media (max-width: 620px) {
        header { align-items: flex-start; flex-direction: column; padding: 16px; }
        h1 { font-size: 20px; }
        .header-actions { flex-wrap: wrap; justify-content: flex-start; width: 100%; }
        .wrap { margin-top: 18px; }
        .card { grid-template-columns: 1fr; align-items: stretch; }
        .account-row { grid-template-columns: 1fr; }
        .account-actions button { flex: 1; }
        .card-action { display: flex; }
        a.review-link { width: 100%; text-align: center; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Open Certificate Queue</h1>
      <div class="header-actions">
        <a class="action-link" href="/doctor/patients">Search</a>
        <a class="action-link" href="/verify">Verify</a>
        <button id="toggle-accounts">Approvals</button>
        <button id="toggle-profile">Profile</button>
        <button id="logout">Logout</button>
      </div>
    </header>
    <main class="wrap">
      <section id="profile-card" class="profile-card hidden">
        <h2 style="margin:0 0 4px;font-size:20px;font-family:'Inter', Arial, sans-serif;">Doctor profile</h2>
        <p style="margin:0 0 12px;color:#4a7fa7;font-size:13px;">These details appear on certificates and verification responses.</p>
        <form id="profile-form">
          <div class="profile-grid">
            <div>
              <label for="profile-name">Full name</label>
              <input id="profile-name" name="fullName" type="text" placeholder="Dr Jane Smith" required />
            </div>
            <div>
              <label for="profile-provider-type">Provider type</label>
              <input id="profile-provider-type" name="providerType" type="text" placeholder="General Practitioner" required />
            </div>
            <div>
              <label for="profile-registration">Registration number</label>
              <input id="profile-registration" name="registrationNumber" type="text" placeholder="MED1234567" required />
            </div>
            <div>
              <label for="profile-provider-number">Provider number</label>
              <input id="profile-provider-number" name="providerNumber" type="text" placeholder="1234561A" required />
            </div>
          </div>
          <div class="profile-actions">
            <button id="profile-save" class="primary-btn" type="submit">Save profile</button>
            <div id="profile-status" class="status"></div>
          </div>
        </form>
      </section>

      <section id="accounts-card" class="accounts-card hidden">
        <h2 style="margin:0 0 4px;font-size:20px;font-family:'Inter', Arial, sans-serif;">Doctor account requests</h2>
        <p style="margin:0;color:#4a7fa7;font-size:13px;">Approved doctors can review new portal access requests.</p>
        <div id="accounts-status" class="status"></div>
        <div id="accounts-list" class="accounts-list"></div>
      </section>

      <p class="meta">Pending requests are sorted by newest first. Risk factor helps prioritize reviews.</p>
      <div id="list" class="list"></div>
    </main>
    <script>
      const token = localStorage.getItem('onyaDoctorToken');
      const listNode = document.getElementById('list');
      const profileCard = document.getElementById('profile-card');
      const profileForm = document.getElementById('profile-form');
      const profileStatus = document.getElementById('profile-status');
      const profileSaveButton = document.getElementById('profile-save');
      const accountsCard = document.getElementById('accounts-card');
      const accountsList = document.getElementById('accounts-list');
      const accountsStatus = document.getElementById('accounts-status');

      if (!token) {
        window.location.href = '/doctor/login';
      }

      document.getElementById('toggle-profile').addEventListener('click', () => {
        profileCard.classList.toggle('hidden');
      });

      document.getElementById('toggle-accounts').addEventListener('click', () => {
        accountsCard.classList.toggle('hidden');
        if (!accountsCard.classList.contains('hidden')) {
          loadDoctorAccounts();
        }
      });

      if (new URLSearchParams(window.location.search).get('panel') === 'approvals') {
        accountsCard.classList.remove('hidden');
        loadDoctorAccounts();
      }

      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('onyaDoctorToken');
        window.location.href = '/doctor/login';
      });

      function setProfileStatus(message, isError = false) {
        profileStatus.textContent = message || '';
        profileStatus.classList.toggle('error', Boolean(message && isError));
        profileStatus.classList.toggle('success', Boolean(message && !isError));
      }

      function riskClass(level) {
        const normalized = String(level || '').toUpperCase();
        if (normalized === 'HIGH') return 'risk-high';
        if (normalized === 'MEDIUM') return 'risk-medium';
        return 'risk-low';
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;',
        })[character]);
      }

      async function parseJsonResponse(response) {
        const text = await response.text();
        if (!text) return {};
        try {
          return JSON.parse(text);
        } catch {
          return { error: text.slice(0, 180) || 'Non-JSON response' };
        }
      }

      async function loadProfile() {
        const response = await fetch('/api/doctor/profile', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const payload = await parseJsonResponse(response);
        if (!response.ok) {
          if (response.status === 401) {
            localStorage.removeItem('onyaDoctorToken');
            window.location.href = '/doctor/login';
            return;
          }
          throw new Error(payload.error || 'Failed to load doctor profile');
        }

        const doctor = payload.doctor || {};
        document.getElementById('profile-name').value = doctor.fullName || '';
        document.getElementById('profile-provider-type').value = doctor.providerType || '';
        document.getElementById('profile-registration').value = doctor.registrationNumber || '';
        document.getElementById('profile-provider-number').value = doctor.providerNumber || '';
      }

      profileForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        setProfileStatus('');
        profileSaveButton.disabled = true;

        const payload = Object.fromEntries(new FormData(profileForm).entries());
        try {
          const response = await fetch('/api/doctor/profile', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
          });
          const data = await parseJsonResponse(response);
          if (!response.ok) {
            throw new Error(data.error || 'Failed to update profile');
          }
          setProfileStatus('Profile updated.');
          document.getElementById('profile-name').value = data?.doctor?.fullName || payload.fullName || '';
          document.getElementById('profile-provider-type').value = data?.doctor?.providerType || payload.providerType || '';
          document.getElementById('profile-registration').value = data?.doctor?.registrationNumber || payload.registrationNumber || '';
          document.getElementById('profile-provider-number').value = data?.doctor?.providerNumber || payload.providerNumber || '';
        } catch (error) {
          setProfileStatus(error.message || 'Failed to update profile.', true);
        } finally {
          profileSaveButton.disabled = false;
        }
      });

      async function loadQueue() {
        const response = await fetch('/api/doctor/certificates?status=pending', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const payload = await parseJsonResponse(response);
        if (!response.ok) {
          localStorage.removeItem('onyaDoctorToken');
          window.location.href = '/doctor/login';
          return;
        }

        if (!payload.certificates.length) {
          listNode.innerHTML = '<div class="empty">No pending certificates right now.</div>';
          return;
        }

        listNode.innerHTML = payload.certificates.map((item) => {
          const risk = item.risk || {};
          const needsReply = Boolean(item.messageSummary?.needsReply);
          const messageBadge = needsReply
            ? `<span class="message-badge" title="Latest message is from the patient">
                <svg class="message-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
                Needs reply
              </span>`
            : '';

          return `
            <article class="card${needsReply ? ' needs-reply' : ''}">
              <div>
                <strong>${escapeHtml(item.patientName || 'Unnamed patient')}</strong>
                <div class="id">Request ${escapeHtml(item.id)} · ${escapeHtml(new Date(item.createdAt).toLocaleString())}</div>
                <div class="id">Verification ${escapeHtml(item.verificationCode || '-')}</div>
                <div class="card-badges">
                  <span class="risk ${riskClass(risk.level)}">${escapeHtml(String(risk.level || 'low').toUpperCase())} RISK (${escapeHtml(risk.score ?? 0)})</span>
                  ${messageBadge}
                </div>
              </div>
              <div class="card-action">
                <a class="review-link" href="/doctor/review?id=${encodeURIComponent(item.id)}">Open Review</a>
              </div>
            </article>
          `;
        }).join('');
      }

      async function loadDoctorAccounts() {
        accountsStatus.textContent = 'Loading account requests...';
        accountsStatus.className = 'status';
        accountsList.innerHTML = '';

        const response = await fetch('/api/doctor/accounts?status=pending', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const payload = await parseJsonResponse(response);
        if (!response.ok) {
          accountsStatus.textContent = payload.error || 'Unable to load doctor accounts.';
          accountsStatus.className = 'status error';
          return;
        }

        const doctors = Array.isArray(payload.doctors) ? payload.doctors : [];
        accountsStatus.textContent = doctors.length
          ? `${doctors.length} account request${doctors.length === 1 ? '' : 's'} awaiting review.`
          : 'No doctor accounts are awaiting review.';
        accountsList.innerHTML = doctors.map((doctor) => `
          <div class="account-row" data-email="${escapeHtml(doctor.email || '')}">
            <div class="account-details">
              <strong>${escapeHtml(doctor.fullName || 'Unnamed applicant')}</strong>
              <div class="account-email">${escapeHtml(doctor.email || '')}</div>
              <div class="account-email">${escapeHtml(doctor.providerType || 'Provider type not supplied')} · ${escapeHtml(doctor.registrationNumber || 'Registration not supplied')}</div>
            </div>
            <div class="account-actions">
              <button class="primary-btn" type="button" data-approval="approved">Approve</button>
              <button class="reject-btn" type="button" data-approval="rejected">Reject</button>
            </div>
          </div>
        `).join('');
      }

      accountsList.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-approval]');
        if (!button) return;
        const row = button.closest('[data-email]');
        const email = row?.dataset?.email || '';
        const approvalStatus = button.dataset.approval || '';
        if (!email || !approvalStatus) return;

        row.querySelectorAll('button').forEach((item) => { item.disabled = true; });
        accountsStatus.textContent = `${approvalStatus === 'approved' ? 'Approving' : 'Rejecting'} ${email}...`;
        const response = await fetch(`/api/doctor/accounts/${encodeURIComponent(email)}/approval`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ approvalStatus }),
        });
        const payload = await parseJsonResponse(response);
        if (!response.ok) {
          accountsStatus.textContent = payload.error || 'Unable to update the doctor account.';
          accountsStatus.className = 'status error';
          row.querySelectorAll('button').forEach((item) => { item.disabled = false; });
          return;
        }

        accountsStatus.textContent = `${email} was ${approvalStatus}.`;
        accountsStatus.className = 'status success';
        await loadDoctorAccounts();
      });

      loadProfile().catch((error) => {
        setProfileStatus(error?.message || 'Failed to load doctor profile.', true);
      });

      loadQueue().catch((error) => {
        listNode.innerHTML = `<div class="empty">${error?.message || 'Failed to load queue.'}</div>`;
      });
    </script>
  </body>
</html>
