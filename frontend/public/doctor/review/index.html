<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Review - Supadoc</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; margin: 0; background: #f6fafd; color: #0a1931; }
      header { padding: 18px 24px; border-bottom: 1px solid #b3cfe5; background: #fff; display: flex; justify-content: space-between; align-items: center; }
      main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
      .panel { background: #fff; border: 1px solid #b3cfe5; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .label { font-size: 12px; text-transform: uppercase; color: #4a7fa7; letter-spacing: 0.08em; margin-bottom: 4px; }
      .value { font-weight: 600; }
      textarea { width: 100%; min-height: 140px; border: 1px solid #b3cfe5; border-radius: 10px; padding: 10px; box-sizing: border-box; font: inherit; line-height: 1.45; }
      input, select { width: 100%; min-height: 44px; border: 1px solid #b3cfe5; border-radius: 10px; padding: 10px; box-sizing: border-box; background: #fff; color: #0a1931; font: inherit; }
      input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #2879b9; outline-offset: 2px; }
      input[readonly] { background: #f6fafd; color: #4a7fa7; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
      button { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      .approve { background: #1a3d63; color: #fff; }
      .deny { background: #d94848; color: #fff; }
      .secondary { border: 1px solid #b3cfe5; background: #fff; color: #1a3d63; }
      .close { background: #0a1931; color: #fff; }
      .orange { background: #f59e0b; color: #fff; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .status { margin-top: 12px; font-size: 13px; min-height: 18px; }
      .muted { color: #4a7fa7; }
      .success { color: #1a3d63; }
      .error { color: #a93736; }
      iframe { width: 100%; min-height: 640px; border: 1px solid #b3cfe5; border-radius: 10px; background: #fff; }
      .summary { margin-top: 14px; padding-top: 14px; border-top: 1px solid #b3cfe5; }
      .message-thread { display: grid; gap: 10px; margin: 12px 0; }
      .message-empty { padding: 14px; border: 1px dashed #b3cfe5; border-radius: 10px; color: #4a7fa7; }
      .message { max-width: 78%; border: 1px solid #b3cfe5; border-radius: 12px; padding: 10px 12px; background: #f6fafd; }
      .message.doctor, .message.support { margin-left: auto; color: #fff; }
      .message.doctor { background: #1a3d63; border-color: #1a3d63; }
      .message.support { background: #2879b9; border-color: #2879b9; }
      .message-meta { margin-bottom: 4px; font-size: 11px; font-weight: 700; opacity: 0.75; }
      .message-body { white-space: pre-wrap; overflow-wrap: anywhere; }
      .reply-as { border: 0; padding: 0; margin: 0 0 14px; }
      .reply-as-options { display: inline-grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 4px; padding: 4px; border: 1px solid #b3cfe5; border-radius: 10px; background: #f6fafd; }
      .reply-option { position: relative; cursor: pointer; }
      .reply-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .reply-option span { display: flex; min-height: 36px; align-items: center; justify-content: center; border-radius: 7px; padding: 0 12px; color: #1a3d63; font-size: 13px; font-weight: 700; }
      .reply-option input:checked + span { background: #1a3d63; color: #fff; }
      .reply-option input[value="support"]:checked + span { background: #2879b9; }
      .reply-option input:focus-visible + span { outline: 2px solid #2879b9; outline-offset: 2px; }
      .reply-option input:disabled + span { cursor: not-allowed; opacity: 0.55; }
      #reply { min-height: 96px; }
      #certificate-statement { min-height: 126px; }
      .field-spacer { margin-top: 16px; }
      .admin-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .admin-heading h2 { margin: 0; font-size: 20px; }
      .admin-heading p { margin: 5px 0 0; color: #4a7fa7; font-size: 13px; }
      .admin-badge { border-radius: 999px; background: #e7f2ff; color: #1a3d63; padding: 6px 9px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
      .edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .edit-field { min-width: 0; }
      .edit-field.wide { grid-column: 1 / -1; }
      .edit-field textarea { min-height: 112px; }
      [hidden] { display: none !important; }
      @media (max-width: 640px) {
        header { align-items: flex-start; gap: 12px; }
        .message { max-width: 92%; }
        .edit-grid { grid-template-columns: 1fr; }
        .edit-field.wide { grid-column: auto; }
        .admin-heading { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 style="margin:0;font-size:24px">Certificate Review</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="/verify" class="secondary" style="text-decoration:none;">Verify</a>
        <button class="secondary" onclick="window.location.href='/doctor/queue'">Back to Queue</button>
      </div>
    </header>
    <main>
      <div id="content" class="panel">Loading certificate...</div>
      <div id="admin-edit-panel" class="panel" hidden>
        <div class="admin-heading">
          <div>
            <h2>Certificate fields</h2>
            <p>Administrator corrections are recorded in the request audit trail.</p>
          </div>
          <span class="admin-badge">Admin</span>
        </div>
        <div class="edit-grid">
          <label class="edit-field">
            <span class="label">Patient name</span>
            <input id="edit-full-name" maxlength="160" />
          </label>
          <label class="edit-field">
            <span class="label">Patient email (account)</span>
            <input id="edit-email" type="email" readonly />
          </label>
          <label class="edit-field">
            <span class="label">Date of birth</span>
            <input id="edit-dob" type="date" min="1900-01-01" />
          </label>
          <label class="edit-field">
            <span class="label">Phone</span>
            <input id="edit-phone" maxlength="40" />
          </label>
          <label class="edit-field wide">
            <span class="label">Address</span>
            <input id="edit-address" maxlength="300" />
          </label>
          <label class="edit-field">
            <span class="label">Purpose</span>
            <input id="edit-purpose" maxlength="120" />
          </label>
          <label class="edit-field">
            <span class="label">Symptom</span>
            <input id="edit-symptom" maxlength="500" />
          </label>
          <label class="edit-field">
            <span class="label">Symptom visibility</span>
            <select id="edit-symptom-visibility">
              <option value="private">Private</option>
              <option value="public">Shown on certificate</option>
            </select>
          </label>
          <label class="edit-field">
            <span class="label">Certificate start date</span>
            <input id="edit-start-date" type="date" />
          </label>
          <label class="edit-field">
            <span class="label">Duration (days)</span>
            <input id="edit-duration" type="number" min="1" max="7" step="1" />
          </label>
          <label class="edit-field wide">
            <span class="label">Clinical notes from patient</span>
            <textarea id="edit-description" maxlength="4000"></textarea>
          </label>
        </div>
        <div class="actions">
          <button id="save-fields" class="secondary">Save corrections</button>
          <button id="reissue" class="approve">Reissue &amp; email patient</button>
        </div>
        <div id="admin-edit-status" class="status muted"></div>
      </div>
      <div class="panel">
        <div class="label">Patient conversation</div>
        <div id="message-thread" class="message-thread"></div>
        <fieldset class="reply-as">
          <legend class="label">Reply as</legend>
          <div class="reply-as-options">
            <label class="reply-option">
              <input type="radio" name="reply-sender" value="doctor" checked />
              <span>Doctor</span>
            </label>
            <label class="reply-option">
              <input type="radio" name="reply-sender" value="support" />
              <span>Customer support</span>
            </label>
          </div>
        </fieldset>
        <label class="label" for="reply">Reply to patient</label>
        <textarea id="reply" maxlength="4000" placeholder="Write a clear message for the patient..."></textarea>
        <div class="actions">
          <button id="send-reply" class="approve">Send as Doctor</button>
        </div>
        <div id="message-status" class="status muted"></div>
      </div>
      <div class="panel">
        <label class="label" for="certificate-statement">Certificate wording</label>
        <textarea id="certificate-statement" maxlength="1200"></textarea>
        <label class="label field-spacer" for="notes">Doctor Notes</label>
        <textarea id="notes" placeholder="Add your clinical review notes here..."></textarea>
        <div class="actions">
          <button id="assign" class="secondary">Assign to me</button>
          <button id="auto-notes" class="secondary">AI summary</button>
          <button id="more-info" class="orange">Send more info request</button>
          <button id="preview-pdf" class="secondary">Preview PDF</button>
          <button id="approve" class="approve">Approve & Send Certificate</button>
          <button id="deny" class="deny">Deny Request</button>
          <button id="close" class="close">Close Certificate</button>
        </div>
        <div id="status" class="status muted"></div>
      </div>
      <div id="preview-panel" class="panel" style="display:none">
        <div class="label">PDF Preview</div>
        <iframe id="preview-frame" title="PDF preview"></iframe>
      </div>
    </main>
    <script>
      const token = localStorage.getItem('onyaDoctorToken');
      if (!token) {
        const returnTo = `${window.location.pathname}${window.location.search}`;
        window.location.href = `/doctor/login?returnTo=${encodeURIComponent(returnTo)}`;
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const contentNode = document.getElementById('content');
      const statusNode = document.getElementById('status');
      const notesNode = document.getElementById('notes');
      const certificateStatementNode = document.getElementById('certificate-statement');
      const replyNode = document.getElementById('reply');
      const replySenderNodes = Array.from(document.querySelectorAll('input[name="reply-sender"]'));
      const sendReplyButton = document.getElementById('send-reply');
      const messageThreadNode = document.getElementById('message-thread');
      const messageStatusNode = document.getElementById('message-status');
      const previewPanel = document.getElementById('preview-panel');
      const previewFrame = document.getElementById('preview-frame');
      const adminEditPanel = document.getElementById('admin-edit-panel');
      const adminEditStatusNode = document.getElementById('admin-edit-status');
      const adminFieldNodes = {
        fullName: document.getElementById('edit-full-name'),
        email: document.getElementById('edit-email'),
        dob: document.getElementById('edit-dob'),
        phone: document.getElementById('edit-phone'),
        address: document.getElementById('edit-address'),
        purpose: document.getElementById('edit-purpose'),
        symptom: document.getElementById('edit-symptom'),
        symptomVisibility: document.getElementById('edit-symptom-visibility'),
        startDate: document.getElementById('edit-start-date'),
        durationDays: document.getElementById('edit-duration'),
        description: document.getElementById('edit-description'),
      };

      const buttonIds = ['send-reply', 'assign', 'auto-notes', 'more-info', 'preview-pdf', 'approve', 'deny', 'close', 'save-fields', 'reissue'];
      const actionButtons = buttonIds.map((buttonId) => document.getElementById(buttonId));
      let previewObjectUrl = null;
      let currentStatus = null;
      let currentMessages = [];
      let currentCertificate = null;
      let canEditCertificate = false;
      let canReissueCertificate = false;

      function dateInputValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      const latestDob = new Date();
      latestDob.setFullYear(latestDob.getFullYear() - 16);
      adminFieldNodes.dob.max = dateInputValue(latestDob);

      if (!id) {
        contentNode.textContent = 'Missing certificate ID.';
      }

      function formatReasons(reasons) {
        if (!reasons || !reasons.length) return 'No additional flags';
        return reasons.join(', ');
      }

      function escapeHtml(value) {
        return String(value || '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function formatMessageDate(value) {
        const date = new Date(value || '');
        if (Number.isNaN(date.getTime())) return '';
        return new Intl.DateTimeFormat('en-AU', {
          dateStyle: 'medium',
          timeStyle: 'short',
        }).format(date);
      }

      function renderMessages(messages) {
        currentMessages = Array.isArray(messages) ? messages : [];
        if (currentMessages.length === 0) {
          messageThreadNode.innerHTML = '<div class="message-empty">No messages in this request yet.</div>';
          return;
        }
        messageThreadNode.innerHTML = currentMessages
          .map((entry) => {
            const fromDoctor = entry?.sender === 'doctor';
            const fromSupport = entry?.sender === 'support';
            const senderName = entry?.senderName || (fromDoctor ? 'Doctor' : fromSupport ? 'Customer support' : 'Patient');
            const sentAt = formatMessageDate(entry?.createdAt);
            return `
              <div class="message ${fromDoctor ? 'doctor' : fromSupport ? 'support' : ''}">
                <div class="message-meta">${escapeHtml(senderName)}${sentAt ? ` · ${escapeHtml(sentAt)}` : ''}</div>
                <div class="message-body">${escapeHtml(entry?.message || '')}</div>
              </div>
            `;
          })
          .join('');
      }

      function isOpenStatus(status) {
        const value = String(status || '').toLowerCase();
        return ['pending', 'submitted', 'triaged', 'assigned', 'in_review'].includes(value);
      }

      function canCloseStatus(status) {
        const value = String(status || '').toLowerCase();
        return ['approved', 'denied'].includes(value);
      }

      function setBusy(isBusy) {
        if (isBusy) {
          actionButtons.forEach((button) => {
            button.disabled = true;
          });
          replySenderNodes.forEach((node) => {
            node.disabled = true;
          });
          return;
        }
        updateActionAvailability();
      }

      function setStatus(message, tone) {
        statusNode.textContent = message;
        statusNode.className = 'status';
        if (tone === 'success') {
          statusNode.classList.add('success');
          return;
        }
        if (tone === 'error') {
          statusNode.classList.add('error');
          return;
        }
        statusNode.classList.add('muted');
      }

      function setMessageStatus(message, tone) {
        messageStatusNode.textContent = message;
        messageStatusNode.className = 'status';
        messageStatusNode.classList.add(tone === 'error' ? 'error' : tone === 'success' ? 'success' : 'muted');
      }

      function setAdminEditStatus(message, tone) {
        adminEditStatusNode.textContent = message;
        adminEditStatusNode.className = 'status';
        adminEditStatusNode.classList.add(tone === 'error' ? 'error' : tone === 'success' ? 'success' : 'muted');
      }

      function populateAdminFields(cert) {
        adminFieldNodes.fullName.value = cert.patientName || '';
        adminFieldNodes.email.value = cert.patientEmail || '';
        adminFieldNodes.dob.value = cert.patientDob || '';
        adminFieldNodes.phone.value = cert.patientPhone || '';
        adminFieldNodes.address.value = cert.patientAddress || '';
        adminFieldNodes.purpose.value = cert.purpose || '';
        adminFieldNodes.symptom.value = cert.symptom || '';
        adminFieldNodes.symptomVisibility.value = cert.symptomVisibility === 'public' ? 'public' : 'private';
        adminFieldNodes.startDate.value = cert.startDate || '';
        adminFieldNodes.durationDays.value = String(cert.durationDays || 1);
        adminFieldNodes.description.value = cert.description || '';
      }

      function readAdminFields() {
        return {
          fullName: adminFieldNodes.fullName.value.trim(),
          dob: adminFieldNodes.dob.value,
          phone: adminFieldNodes.phone.value.trim(),
          address: adminFieldNodes.address.value.trim(),
          purpose: adminFieldNodes.purpose.value.trim(),
          symptom: adminFieldNodes.symptom.value.trim(),
          symptomVisibility: adminFieldNodes.symptomVisibility.value,
          startDate: adminFieldNodes.startDate.value,
          durationDays: Number(adminFieldNodes.durationDays.value),
          description: adminFieldNodes.description.value.trim(),
        };
      }

      function adminRequestFields() {
        return canEditCertificate ? readAdminFields() : undefined;
      }

      function getReplySenderType() {
        return replySenderNodes.find((node) => node.checked)?.value === 'support' ? 'support' : 'doctor';
      }

      function updateReplyMode() {
        const senderType = getReplySenderType();
        sendReplyButton.textContent = senderType === 'support' ? 'Send as Customer support' : 'Send as Doctor';
      }

      function updateActionAvailability() {
        const open = isOpenStatus(currentStatus);
        const issued = String(currentStatus || '').toLowerCase() === 'approved';
        document.getElementById('preview-pdf').disabled = !currentStatus;
        document.getElementById('auto-notes').disabled = !open;
        document.getElementById('approve').disabled = !open;
        document.getElementById('deny').disabled = !open;
        document.getElementById('more-info').disabled = !open;
        document.getElementById('assign').disabled = !open;
        sendReplyButton.disabled = !open;
        replySenderNodes.forEach((node) => {
          node.disabled = !open;
        });
        replyNode.disabled = !open;
        notesNode.disabled = !(open || (canEditCertificate && issued));
        certificateStatementNode.disabled = !(open || (canEditCertificate && issued));
        document.getElementById('close').disabled = !canCloseStatus(currentStatus);
        document.getElementById('save-fields').disabled = !(canEditCertificate && open);
        document.getElementById('reissue').disabled = !(canReissueCertificate && issued);
        Object.entries(adminFieldNodes).forEach(([fieldName, node]) => {
          node.disabled = fieldName === 'email' || !(canEditCertificate && (open || issued));
        });
      }

      async function parseResponseJson(response) {
        const text = await response.text();
        if (!text) return {};
        try {
          return JSON.parse(text);
        } catch {
          return { error: text.slice(0, 180) || 'Non-JSON API response' };
        }
      }

      async function loadCertificate() {
        const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        const payload = await parseResponseJson(response);
        if (!response.ok) {
          if (response.status === 401) {
            localStorage.removeItem('onyaDoctorToken');
            window.location.href = '/doctor/login';
            return;
          }
          contentNode.textContent = payload.error || 'Failed to load certificate';
          return;
        }

        const cert = payload.certificate;
        currentCertificate = cert;
        currentStatus = cert.status;
        canEditCertificate = Boolean(payload.permissions?.canEditCertificate);
        canReissueCertificate = Boolean(payload.permissions?.canReissueCertificate);
        adminEditPanel.hidden = !canEditCertificate;
        if (canEditCertificate) {
          populateAdminFields(cert);
        }
        renderMessages(cert.messages);
        if (cert.decision?.notes) {
          notesNode.value = cert.decision.notes;
        }
        certificateStatementNode.value = cert.certificateStatement || '';

        contentNode.innerHTML = `
          <div class="grid">
            <div><div class="label">Patient</div><div class="value">${escapeHtml(cert.patientName || '-')}</div></div>
            <div><div class="label">Email</div><div class="value">${escapeHtml(cert.patientEmail || '-')}</div></div>
            <div><div class="label">DOB</div><div class="value">${escapeHtml(cert.patientDob || '-')}</div></div>
            <div><div class="label">Age</div><div class="value">${escapeHtml(cert.patientAge ?? '-')}</div></div>
            <div><div class="label">Phone</div><div class="value">${escapeHtml(cert.patientPhone || '-')}</div></div>
            <div><div class="label">Address</div><div class="value">${escapeHtml(cert.patientAddress || '-')}</div></div>
            <div><div class="label">Purpose</div><div class="value">${escapeHtml(cert.purpose || '-')}</div></div>
            <div><div class="label">Symptom</div><div class="value">${escapeHtml(cert.symptom || '-')}</div></div>
            <div><div class="label">Start Date</div><div class="value">${escapeHtml(cert.startDate || '-')}</div></div>
            <div><div class="label">Duration</div><div class="value">${escapeHtml(cert.durationDays || 1)} day(s)</div></div>
            <div><div class="label">Verification</div><div class="value">${escapeHtml(cert.verificationCode || '-')}</div></div>
            <div><div class="label">Certificate revision</div><div class="value">${escapeHtml(cert.certificateRevision || 1)}</div></div>
            <div><div class="label">Risk</div><div class="value">${escapeHtml(String(cert.risk?.level || '').toUpperCase())} (${escapeHtml(cert.risk?.score ?? 0)})</div></div>
            <div><div class="label">Risk Notes</div><div class="value">${escapeHtml(formatReasons(cert.risk?.reasons))}</div></div>
          </div>
          <div class="summary">
            <div class="label">Clinical Notes From Patient</div>
            <div class="value">${escapeHtml(cert.description || 'No summary provided.')}</div>
          </div>
        `;

        updateActionAvailability();
        if (!isOpenStatus(cert.status)) {
          setStatus(`This certificate is already ${cert.status}.`, 'muted');
        }
      }

      async function sendReply() {
        const message = replyNode.value.trim();
        const senderType = getReplySenderType();
        const senderLabel = senderType === 'support' ? 'Customer support' : 'Doctor';
        if (!message) {
          setMessageStatus('Write a message before sending.', 'error');
          return;
        }

        setMessageStatus(`Sending as ${senderLabel}...`, 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/message`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ message, senderType }),
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to send reply');
          }
          replyNode.value = '';
          renderMessages(payload.messages);
          setMessageStatus(payload.message || 'Reply sent to patient.', payload.patientNotificationFailed ? 'error' : 'success');
        } catch (error) {
          setMessageStatus(error.message || 'Failed to send reply.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function submitDecision(decision) {
        if (!isOpenStatus(currentStatus)) {
          setStatus(`This certificate is already ${currentStatus}.`, 'error');
          return;
        }

        setStatus('Submitting decision...', 'muted');
        setBusy(true);

        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/decision`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              decision,
              notes: notesNode.value,
              certificateStatement: certificateStatementNode.value,
              fields: adminRequestFields(),
            }),
          });

          const payload = await parseResponseJson(response);
          if (!response.ok) {
            const reviewedStatus = payload.status ? ` (${payload.status})` : '';
            throw new Error((payload.error || 'Failed to submit decision') + reviewedStatus);
          }

          currentStatus = payload?.certificate?.status || decision;
          setStatus(payload.message || `Certificate ${decision}`, 'success');
          updateActionAvailability();
        } catch (error) {
          setStatus(error.message || 'Failed to submit decision.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function assignCertificate() {
        if (!isOpenStatus(currentStatus)) {
          setStatus(`Cannot assign certificate in status ${currentStatus}.`, 'error');
          return;
        }
        setStatus('Assigning to you...', 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/assign`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to assign certificate');
          }
          currentStatus = payload?.certificate?.status || currentStatus;
          setStatus(payload.message || 'Assigned.', 'success');
          updateActionAvailability();
        } catch (error) {
          setStatus(error.message || 'Failed to assign certificate.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function closeCertificate() {
        if (!canCloseStatus(currentStatus)) {
          setStatus('Approve or deny before closing.', 'error');
          return;
        }
        setStatus('Closing certificate...', 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/close`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to close certificate');
          }
          window.location.replace('/doctor/queue');
        } catch (error) {
          setStatus(error.message || 'Failed to close certificate.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function autoGenerateNotes() {
        setStatus('Generating doctor notes...', 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/auto-notes`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ currentNotes: notesNode.value }),
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to generate notes');
          }
          notesNode.value = payload.notes || notesNode.value;
          setStatus('Doctor notes generated.', 'success');
        } catch (error) {
          setStatus(error.message || 'Failed to generate notes.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function addMoreInfoDraft() {
        setStatus('Sending more-info request to patient...', 'muted');
        setBusy(true);
        try {
          let notes = notesNode.value.trim();
          if (!notes) {
            const autoResponse = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/auto-notes`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({}),
            });
            const autoPayload = await parseResponseJson(autoResponse);
            if (autoResponse.ok && autoPayload.notes) {
              notes = autoPayload.notes;
              notesNode.value = notes;
            }
          }

          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/request-more-info`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ notes }),
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to send more-info request');
          }
          currentStatus = payload?.certificate?.status || 'in_review';
          setStatus(payload.message || 'More information request sent.', 'success');
          updateActionAvailability();
        } catch (error) {
          setStatus(error.message || 'Failed to send more-info request.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function saveCertificateFields() {
        if (!canEditCertificate || !isOpenStatus(currentStatus)) return;
        setAdminEditStatus('Saving corrections...', 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              fields: readAdminFields(),
              notes: notesNode.value,
              certificateStatement: certificateStatementNode.value,
            }),
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to save certificate fields');
          }
          currentCertificate = payload.certificate || currentCertificate;
          if (payload.certificate) populateAdminFields(payload.certificate);
          setAdminEditStatus(payload.message || 'Certificate fields saved.', 'success');
          setStatus('Corrections saved. Regenerate the PDF preview before approval.', 'success');
        } catch (error) {
          setAdminEditStatus(error.message || 'Failed to save certificate fields.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function reissueCertificate() {
        if (!canReissueCertificate || String(currentStatus || '').toLowerCase() !== 'approved') return;
        if (!window.confirm('Reissue this certificate and email the corrected PDF to the patient?')) return;

        setAdminEditStatus('Reissuing certificate...', 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/reissue`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              fields: readAdminFields(),
              notes: notesNode.value,
              certificateStatement: certificateStatementNode.value,
            }),
          });
          const payload = await parseResponseJson(response);
          if (!response.ok) {
            throw new Error(payload.error || 'Failed to reissue certificate');
          }
          currentCertificate = payload.certificate || currentCertificate;
          if (payload.certificate) populateAdminFields(payload.certificate);
          setAdminEditStatus(
            payload.message || 'Certificate reissued.',
            payload.patientNotificationFailed ? 'error' : 'success'
          );
          setStatus('The corrected certificate is now the active downloadable version.', 'success');
          document.getElementById('preview-pdf').textContent = 'Regenerate PDF preview';
        } catch (error) {
          setAdminEditStatus(error.message || 'Failed to reissue certificate.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function previewPdf() {
        setStatus('Generating PDF preview...', 'muted');
        setBusy(true);
        try {
          const response = await fetch(`/api/doctor/certificates/${encodeURIComponent(id)}/pdf-preview`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              notes: notesNode.value,
              certificateStatement: certificateStatementNode.value,
              fields: adminRequestFields(),
            }),
          });

          if (!response.ok) {
            const payload = await parseResponseJson(response);
            throw new Error(payload.error || 'Failed to generate PDF preview');
          }

          const pdfBlob = await response.blob();
          if (previewObjectUrl) {
            URL.revokeObjectURL(previewObjectUrl);
          }
          previewObjectUrl = URL.createObjectURL(pdfBlob);
          previewFrame.src = previewObjectUrl;
          previewPanel.style.display = 'block';
          document.getElementById('preview-pdf').textContent = 'Regenerate PDF preview';
          setStatus('Preview generated.', 'success');
        } catch (error) {
          setStatus(error.message || 'Failed to generate PDF preview.', 'error');
        } finally {
          setBusy(false);
        }
      }

      document.getElementById('assign').addEventListener('click', assignCertificate);
      document.getElementById('send-reply').addEventListener('click', sendReply);
      replySenderNodes.forEach((node) => node.addEventListener('change', updateReplyMode));
      updateReplyMode();
      document.getElementById('approve').addEventListener('click', () => submitDecision('approved'));
      document.getElementById('deny').addEventListener('click', () => submitDecision('denied'));
      document.getElementById('close').addEventListener('click', closeCertificate);
      document.getElementById('auto-notes').addEventListener('click', autoGenerateNotes);
      document.getElementById('more-info').addEventListener('click', addMoreInfoDraft);
      document.getElementById('preview-pdf').addEventListener('click', previewPdf);
      document.getElementById('save-fields').addEventListener('click', saveCertificateFields);
      document.getElementById('reissue').addEventListener('click', reissueCertificate);
      certificateStatementNode.addEventListener('input', () => {
        if (previewPanel.style.display !== 'none') {
          setStatus('Certificate wording changed. Regenerate the preview to see the update.', 'muted');
        }
      });
      Object.values(adminFieldNodes).forEach((node) => {
        node.addEventListener('input', () => {
          setAdminEditStatus('Unsaved corrections.', 'muted');
          if (previewPanel.style.display !== 'none') {
            setStatus('Certificate fields changed. Regenerate the preview to see the update.', 'muted');
          }
        });
      });

      if (id) {
        loadCertificate().catch((err) => {
          contentNode.textContent = err?.message || 'Failed to load certificate.';
        });
      } else {
        setBusy(true);
      }
    </script>
  </body>
</html>
